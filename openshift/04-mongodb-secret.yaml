# Phase 2 - "provision MongoDB/configuration"
#
# MongoDB credentials. This is the only place they live. Both the Mongo
# Deployment (07) and the app Deployment (01) reference this same Secret
# via envFrom - deliberately one Secret, not two, to keep the file count
# down for a demo. It provides both sets of key names each side expects:
# MONGO_INITDB_ROOT_* (read by the stock mongo image) and MONGODB_* (read
# by the app's server/config.js).
#
# CHANGE THE PASSWORD before using this outside a throwaway demo cluster.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  labels:
    app: mongodb
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: towerdefense
  MONGO_INITDB_ROOT_PASSWORD: change-me-before-the-demo
  MONGODB_USERNAME: towerdefense
  MONGODB_PASSWORD: change-me-before-the-demo
